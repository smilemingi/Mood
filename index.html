<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Study Mood (Anime Style)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            transition: background-image 2s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #weather-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #time-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            transition: background-color 3s ease, mix-blend-mode 3s ease;
            pointer-events: none;
            z-index: 5;
        }

        #ui-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        
        .control-group span {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            width: 80px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .weather-toggles {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        
        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: bold;
        }
        
        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .toggle-btn.active {
            background: #fff;
            color: #333;
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        #clock-display {
            text-align: center;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        #period-label {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="time-overlay"></div>
        <canvas id="weather-canvas"></canvas>
        
        <div id="ui-panel">
            <div>
                <div id="clock-display">00:00</div>
                <div id="period-label">Loading...</div>
            </div>

            <div class="control-group">
                <span>🎵 BGM</span>
                <input type="range" id="bgm-volume" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <span>🌧️ Weather</span>
                <input type="range" id="sfx-volume" min="0" max="100" value="0">
            </div>

            <div class="weather-toggles">
                <button class="toggle-btn active" data-weather="clear" onclick="setWeather('clear')">Clear</button>
                <button class="toggle-btn" data-weather="rain" onclick="setWeather('rain')">Rain</button>
                <button class="toggle-btn" data-weather="snow" onclick="setWeather('snow')">Snow</button>
            </div>
        </div>
    </div>

    <audio id="audio-bgm" loop>
        <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio-rain" loop>
        <source src="https://cdn.pixabay.com/audio/2021/08/09/audio_6b9788a449.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio-snow" loop>
        <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_29fb665d91.mp3" type="audio/mpeg">
    </audio>

    <script>
        const appContainer = document.getElementById('app-container');
        const timeOverlay = document.getElementById('time-overlay');
        const clockDisplay = document.getElementById('clock-display');
        const periodLabel = document.getElementById('period-label');

        const bgImages = {
            dawn: 'https://images.unsplash.com/photo-1542281286-9e0a16bb7366?w=1600&q=80',
            morning: 'https://images.unsplash.com/photo-1494548162494-384bba4ab999?w=1600&q=80',
            afternoon: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600&q=80',
            evening: 'https://images.unsplash.com/photo-1472552944129-b035e9ea3744?w=1600&q=80',
            night: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1600&q=80'
        };

        let currentPeriod = '';

        function updateTimeAndTheme() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            
            clockDisplay.textContent = `${hours.toString().padStart(2, '0')}:${minutes}`;

            let newPeriod = '';
            let overlayStyle = { bg: 'transparent', blend: 'normal' };

            if (hours >= 5 && hours < 8) {
                newPeriod = 'dawn';
                overlayStyle = { bg: 'rgba(50, 80, 150, 0.3)', blend: 'multiply' };
            } else if (hours >= 8 && hours < 12) {
                newPeriod = 'morning';
                overlayStyle = { bg: 'rgba(255, 255, 230, 0.1)', blend: 'overlay' };
            } else if (hours >= 12 && hours < 17) {
                newPeriod = 'afternoon';
                overlayStyle = { bg: 'transparent', blend: 'normal' };
            } else if (hours >= 17 && hours < 20) {
                newPeriod = 'evening';
                overlayStyle = { bg: 'rgba(250, 120, 50, 0.25)', blend: 'color-burn' };
            } else {
                newPeriod = 'night';
                overlayStyle = { bg: 'rgba(10, 15, 40, 0.6)', blend: 'multiply' };
            }

            if (newPeriod !== currentPeriod) {
                currentPeriod = newPeriod;
                periodLabel.textContent = newPeriod + " time";
                appContainer.style.backgroundImage = `url('${bgImages[newPeriod]}')`;
                timeOverlay.style.backgroundColor = overlayStyle.bg;
                timeOverlay.style.mixBlendMode = overlayStyle.blend;
            }
        }

        updateTimeAndTheme();
        setInterval(updateTimeAndTheme, 60000);

        const bgmAudio = document.getElementById('audio-bgm');
        const rainAudio = document.getElementById('audio-rain');
        const snowAudio = document.getElementById('audio-snow');
        const bgmSlider = document.getElementById('bgm-volume');
        const sfxSlider = document.getElementById('sfx-volume');

        let isPlaying = false;

        function initAudio() {
            if(!isPlaying) {
                bgmAudio.volume = bgmSlider.value / 100;
                bgmAudio.play().catch(e => console.log("Autoplay prevented:", e));
                isPlaying = true;
            }
        }

        bgmSlider.addEventListener('input', (e) => {
            bgmAudio.volume = e.target.value / 100;
            initAudio();
        });

        sfxSlider.addEventListener('input', (e) => {
            const vol = e.target.value / 100;
            rainAudio.volume = vol;
            snowAudio.volume = vol;
            initAudio();
        });

        const canvas = document.getElementById('weather-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let currentWeather = 'clear';

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(type) {
                this.type = type;
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                if (this.type === 'rain') {
                    this.speed = Math.random() * 15 + 10;
                    this.width = Math.random() * 1.5 + 0.5;
                    this.height = Math.random() * 20 + 10;
                } else {
                    this.speed = Math.random() * 2 + 1;
                    this.radius = Math.random() * 3 + 1;
                    this.angle = Math.random() * Math.PI * 2;
                    this.wobble = Math.random() * 0.05;
                }
            }
            update() {
                if (this.type === 'rain') {
                    this.y += this.speed;
                } else {
                    this.y += this.speed;
                    this.angle += this.wobble;
                    this.x += Math.sin(this.angle) * 1.5;
                }
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                if (this.type === 'rain') {
                    ctx.strokeStyle = 'rgba(200, 220, 255, 0.6)';
                    ctx.lineWidth = this.width;
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y + this.height);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function createParticles(type, count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(type));
            }
        }

        function animateWeather() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateWeather);
        }
        animateWeather();

        window.setWeather = function(type) {
            currentWeather = type;
            initAudio();
            
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.weather === type) btn.classList.add('active');
            });

            if (type === 'clear') {
                particles = [];
                rainAudio.pause();
                snowAudio.pause();
                sfxSlider.value = 0;
            } else if (type === 'rain') {
                createParticles('rain', 200);
                snowAudio.pause();
                rainAudio.play().catch(e=>{});
                if(sfxSlider.value == 0) sfxSlider.value = 50; 
                rainAudio.volume = sfxSlider.value / 100;
            } else if (type === 'snow') {
                createParticles('snow', 150);
                rainAudio.pause();
                snowAudio.play().catch(e=>{});
                if(sfxSlider.value == 0) sfxSlider.value = 50;
                snowAudio.volume = sfxSlider.value / 100;
            }
        };

        document.body.addEventListener('click', initAudio, { once: true });
    </script>
</body>
</html>
